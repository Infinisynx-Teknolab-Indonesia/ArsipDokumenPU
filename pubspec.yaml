name: arsip_dokumen
description: Arsip Dokumen Proyek PU — arsip dokumen pembangunan jalan/jembatan/gedung, admin & staf, mode offline + upload otomatis.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.4.3    # fullscreen + kontrol window
  http: ^1.2.2              # REST ke API (FastAPI / C# .NET)
  crypto: ^3.0.3            # PBKDF2-SHA256 untuk login offline
  file_picker: ^8.1.2       # pilih file PDF / Word / Excel / TXT / foto
  sembast: ^3.7.4           # database NoSQL lokal (offline) — murni Dart, tanpa DLL tambahan
  tray_manager: ^0.5.2      # ikon di system tray (pojok kanan bawah taskbar), sama seperti Batam ChitChat
  # Penampil dokumen DI DALAM aplikasi (tanpa WPS / Office):
  pdfrx: ">=2.1.0 <2.5.0"   # PDF (mesin PDFium seperti Chrome) — versi dipilih otomatis sesuai Flutter Anda
  archive: ">=3.6.1 <5.0.0" # membuka isi file .docx / .xlsx (format ZIP)
  xml: ^6.5.0               # membaca isi Word & Excel

# Sama seperti Batam ChitChat: path_provider_android >=2.3 menarik package:jni
# yang gagal dikompilasi saat build Windows. Aman walau tidak terpakai.
dependency_overrides:
  path_provider_android: 2.2.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.ico
    - assets/icons/tray_icon_mac.png   # ikon menu bar macOS
